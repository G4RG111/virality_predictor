services:
  - type: web
    name: vibe-backend
    runtime: python
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./vibe.db
      - key: CORS_ORIGINS_STR
        value: "*"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
